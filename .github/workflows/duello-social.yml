name: Düello sosyal medya paylaşımı

# 4 posts a day, Istanbul time (UTC+3): 09:07 challenge, 13:13 duel, 19:11 yesterday's word, 22:09 league
on:
  schedule:
    - cron: "7 6 * * *"
    - cron: "13 10 * * *"
    - cron: "11 16 * * *"
    - cron: "9 19 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "challenge | duel | yesterday | league (boş: saate göre)"
        required: false
        default: ""
      send:
        description: "Buffer'a gönder"
        type: boolean
        default: true

permissions:
  contents: write

concurrency: duello-social

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Görseli hazırla
        env:
          STAGE: make
          KIND: ${{ github.event.inputs.kind }}
          OUT_DIR: duello-social/posts
        run: python duello-social/post.py
      - name: Görseli yayınla
        run: |
          git config user.name "Düello Bot"
          git config user.email "actions@users.noreply.github.com"
          git add duello-social/posts
          git commit -m "Düello paylaşım görseli $(date -u +%F)" || true
          git pull --rebase
          git push
          sleep 10
      - name: Buffer'a gönder
        if: github.event_name == 'schedule' || github.event.inputs.send == 'true'
        env:
          STAGE: send
          OUT_DIR: duello-social/posts
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          IMAGE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/duello-social/posts
        run: python duello-social/post.py
