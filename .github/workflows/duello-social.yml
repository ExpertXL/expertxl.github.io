name: Düello sosyal medya paylaşımı

# Every few hours the bot prepares the next posts (today and tomorrow) and hands them to Buffer
# with their exact time: 09:07 challenge, 13:13 duel, 19:11 yesterday's word, 22:09 league (Istanbul).
# Buffer publishes them on the minute, so a late GitHub run never makes a post late.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Planlamak yerine hemen paylaş"
        type: boolean
        default: false
      kind:
        description: "Hemen paylaşımda: challenge | duel | yesterday | league (boş: saate göre)"
        required: false
        default: ""
      services:
        description: "Hemen paylaşımda sadece bu kanallar, ör. instagram (boş: hepsi)"
        required: false
        default: ""

permissions:
  contents: write

concurrency: duello-social

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: duello-social/posts
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      IMAGE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/duello-social/posts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Görselleri hazırla
        env:
          STAGE: ${{ github.event.inputs.now == 'true' && 'make' || 'plan-make' }}
          KIND: ${{ github.event.inputs.kind }}
        run: python duello-social/post.py
      - name: Görselleri yayınla
        run: |
          git config user.name "Düello Bot"
          git config user.email "actions@users.noreply.github.com"
          git add duello-social/posts
          git commit -m "Düello paylaşım görselleri $(date -u +%F)" || true
          git pull --rebase
          git push
          sleep 10
      - name: Buffer'a gönder
        env:
          STAGE: ${{ github.event.inputs.now == 'true' && 'send' || 'plan-send' }}
          SERVICES: ${{ github.event.inputs.services }}
        run: python duello-social/post.py
      - name: Reels
        if: github.event.inputs.now != 'true'
        env:
          STAGE: reels
        run: python duello-social/post.py
      - name: Planı kaydet
        if: always()
        run: |
          git add duello-social/posts
          git commit -m "Düello paylaşım planı" || true
          git pull --rebase
          git push
